<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://kit.fontawesome.com/05ad49203b.js" crossorigin="anonymous"></script>
  <title>PINS</title>
  <!-- include javascript and css-->
  <link rel="stylesheet" href="styles/main.css">
  <script defer src="scripts/scripts.js"></script>
  
  <style>
    main p {
      text-align: center;
    }

    .container {
      display: flex;
      align-items: flex-start;
    }

    .dropdown {
      list-style-type: none;
      padding: 0;
    }

    .dropdown > li {
      cursor: pointer;
    }

    .info-box {
      display: none;
      width: 250px;
      padding: 10px;
      margin-left: 20px;
      border: 1px solid #ccc;
      background-color: #f9f9f9;
    }
  </style>
</head>

<body>
  <header>
    <h1>ADMIN VIEW: Old Pins</h1>
  </header>
  
  <div class="wrapper side-panel-open">
    <main>
    <img src="images/Drag.png" alt="Logo" width="100" height="100">
      <nav>
        <ul>
          <li><a href="main.html"><i class="fa-solid fa-house"></i></a></li>
          <li><a><i class="fa-solid fa-map"></i></a></li>
          <li><a><i class="fa-solid fa-magnifying-glass-minus"></i></a></li>
          <li><a><i class="fa-solid fa-magnifying-glass-plus"></i></a></li>
        </ul>
      </nav>  
      
      <p>Map goes here!</p
      
      <div class="container">
        <ol class="dropdown">
          <li onclick="toggleInfo()">Old Pins:
            <ol>
              <li>Oil Spill</li>
              <li>Canada Goose Nest</li>
              <li>New Flowers</li>
              <li>Graffiti</li>
            </ol>
          </li>
        </ol>

        <!-- Info box that appears on the right -->
        <div id="infoBox" class="info-box">
          <p>Details about the pin.</p>
        </div>
      </div>
    </main>



  <footer></footer>

  <script>
    function toggleInfo() {
      var infoBox = document.getElementById("infoBox");
      infoBox.style.display = infoBox.style.display === "none" || infoBox.style.display === "" ? "block" : "none";
    }
  </script>

</body>

</html>
